<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ăn Vặt Hạt Đậu Nhỏ</title>
<style>
:root{--primary:#ff5a36;--yellow:#ffc857;--dark:#202020;--cream:#fff8ef;--muted:#777}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--dark)}
header{background:linear-gradient(135deg,#ff633f,#ff9d3d);color:white;padding:24px 18px 28px;border-radius:0 0 28px 28px;position:sticky;top:0;z-index:5}
.wrap{max-width:900px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:27px}.brand small{opacity:.9}
.cart-btn{background:white;color:var(--primary);border:0;border-radius:999px;padding:11px 15px;font-weight:bold;cursor:pointer}
.hero{padding:22px 0 5px}.hero h2{font-size:30px;margin:0 0 7px}.hero p{margin:0;opacity:.92}
.search{margin-top:18px;background:white;border:0;border-radius:14px;padding:14px;width:100%;font-size:15px}
section{padding:20px 0}.cats{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.cat{white-space:nowrap;border:1px solid #eee;background:white;border-radius:999px;padding:9px 14px;cursor:pointer}.cat.active{background:var(--dark);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #0000000b}.food-img{width:100%;height:145px;object-fit:cover;background:#eee}.info{padding:12px}.info h3{font-size:17px;margin:0 0 5px}.desc{font-size:12px;color:var(--muted);min-height:30px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.price{font-weight:800;color:var(--primary)}.add{border:0;background:var(--primary);color:white;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.notice{background:#fff1d5;padding:14px 16px;border-radius:16px;font-size:13px;margin-top:4px}
footer{text-align:center;color:#888;padding:28px 0 90px;font-size:13px}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:10}.overlay.show{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(430px,100%);background:#fff;padding:20px;overflow:auto}.drawer h2{margin-top:0}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item img{width:65px;height:65px;border-radius:12px;object-fit:cover}.item-main{flex:1}.qty{display:flex;gap:8px;align-items:center;margin-top:6px}.qty button{border:1px solid #ddd;background:white;border-radius:8px;width:28px;height:28px}
.total{display:flex;justify-content:space-between;font-size:19px;font-weight:bold;padding:18px 0}.checkout{width:100%;padding:14px;border:0;border-radius:14px;background:var(--primary);color:white;font-weight:bold;font-size:16px}
form{display:none;margin-top:12px}.field{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font:inherit}.empty{text-align:center;padding:50px 10px;color:#888}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.food-img{height:180px}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="brand"><div><h1>🍢 Ăn Vặt Hạt Đậu Nhỏ</h1><small>Ngon là ghiền • Giá học sinh</small></div>
  <button class="cart-btn" onclick="openCart()">🛒 Giỏ hàng <span id="count">0</span></button></div>
  <div class="hero"><h2>Ăn gì hôm nay? 😋</h2><p>Đồ ăn vặt nóng hổi, giao nhanh trong khu vực.</p></div>
  <input class="search" id="search" placeholder="🔎 Tìm món ăn..." oninput="render()">
</div></header>

<main class="wrap">
<section><div class="cats" id="cats"></div></section>
<section style="padding-top:0"><div class="notice">🔥 <b>Combo tiết kiệm:</b> Chọn từ 3 món bất kỳ, quán sẽ xác nhận ưu đãi khi nhận đơn.</div></section>
<section><h2>Menu hôm nay</h2><div class="grid" id="menu"></div></section>
<footer>© 2026 Ăn Vặt Hạt Đậu Nhỏ • Website demo</footer>
</main>

<div class="overlay" id="overlay"><div class="drawer">
<button class="close" onclick="closeCart()">✕</button><h2>🛒 Đơn hàng của bạn</h2>
<div id="cart"></div>
<div id="checkoutArea"></div>
</div></div>

<script>
const foods=[
{id:1,name:"Cá viên chiên",cat:"Chiên",price:25000,img:"https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=700&q=80",desc:"Cá viên, rau củ, sốt tương ớt"},
{id:2,name:"Xúc xích Đức",cat:"Chiên",price:20000,img:"https://images.unsplash.com/photo-1612392062631-94dd858cba88?auto=format&fit=crop&w=700&q=80",desc:"Xúc xích chiên giòn, thơm ngon"},
{id:3,name:"Khoai tây lắc",cat:"Chiên",price:30000,img:"https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=700&q=80",desc:"Khoai giòn lắc phô mai"},
{id:4,name:"Bánh tráng trộn",cat:"Bánh tráng",price:25000,img:"https://images.unsplash.com/photo-1625220194771-7ebdea0b70b9?auto=format&fit=crop&w=700&q=80",desc:"Xoài, trứng cút, bò khô, rau răm"},
{id:5,name:"Bánh tráng cuốn",cat:"Bánh tráng",price:30000,img:"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=80",desc:"Cuốn mềm, sốt bơ và hành phi"},
{id:6,name:"Nem chua rán",cat:"Chiên",price:30000,img:"https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=700&q=80",desc:"Nem chua rán vàng giòn"},
{id:7,name:"Trà tắc",cat:"Nước",price:15000,img:"https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=700&q=80",desc:"Chua ngọt, thơm mùi tắc"},
{id:8,name:"Trà đào cam sả",cat:"Nước",price:25000,img:"https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=700&q=80",desc:"Thanh mát, thơm đào và sả"},
{id:9,name:"Chân gà sốt Thái",cat:"Món cay",price:45000,img:"https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=700&q=80",desc:"Chân gà giòn, sốt Thái chua cay"}
];
let cart={}, category="Tất cả";
const money=n=>n.toLocaleString("vi-VN")+"đ";
function renderCats(){let cats=["Tất cả",...new Set(foods.map(x=>x.cat))];document.getElementById("cats").innerHTML=cats.map(c=>`<button class="cat ${c===category?'active':''}" onclick="category='${c}';renderCats();render()">${c}</button>`).join("")}
function render(){let q=document.getElementById("search").value.toLowerCase();let list=foods.filter(x=>(category==="Tất cả"||x.cat===category)&&x.name.toLowerCase().includes(q));document.getElementById("menu").innerHTML=list.map(x=>`<article class="card"><img class="food-img" src="${x.img}" alt="${x.name}"><div class="info"><h3>${x.name}</h3><div class="desc">${x.desc}</div><div class="row"><span class="price">${money(x.price)}</span><button class="add" onclick="add(${x.id})">+</button></div></div></article>`).join("")}
function add(id){cart[id]=(cart[id]||0)+1;updateCount();openCart()}
function updateCount(){document.getElementById("count").textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function openCart(){document.getElementById("overlay").classList.add("show");renderCart()}
function closeCart(){document.getElementById("overlay").classList.remove("show")}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];updateCount();renderCart()}
function renderCart(){
 let ids=Object.keys(cart), box=document.getElementById("cart");
 if(!ids.length){box.innerHTML='<div class="empty">Giỏ hàng đang trống 🥹<br>Hãy chọn món ngon nhé!</div>';document.getElementById("checkoutArea").innerHTML="";return}
 let total=0;
 box.innerHTML=ids.map(id=>{let x=foods.find(f=>f.id==id),q=cart[id];total+=x.price*q;return `<div class="item"><img src="${x.img}"><div class="item-main"><b>${x.name}</b><div>${money(x.price)}</div><div class="qty"><button onclick="change(${x.id},-1)">−</button><span>${q}</span><button onclick="change(${x.id},1)">+</button></div></div></div>`}).join("");
 document.getElementById("checkoutArea").innerHTML=`<div class="total"><span>Tạm tính</span><span>${money(total)}</span></div><button class="checkout" onclick="showForm()">Đặt hàng</button><form id="form" onsubmit="submitOrder(event)"><input class="field" id="name" required placeholder="Tên của bạn"><input class="field" id="phone" required placeholder="Số điện thoại"><input class="field" id="address" required placeholder="Địa chỉ nhận hàng"><textarea class="field" id="note" placeholder="Ghi chú (ít cay, thêm sốt...)"></textarea><button class="checkout">Xác nhận đơn</button></form>`;
}
function showForm(){document.getElementById("form").style.display="block";document.getElementById("form").scrollIntoView({behavior:"smooth"})}
function submitOrder(e){e.preventDefault();let lines=Object.keys(cart).map(id=>{let x=foods.find(f=>f.id==id);return `${x.name} x${cart[id]}`}).join("\\n");let total=Object.keys(cart).reduce((s,id)=>s+foods.find(f=>f.id==id).price*cart[id],0);let msg=`ĐƠN HÀNG ĂN VẶT\\n${lines}\\nTạm tính: ${money(total)}\\nKhách: ${document.getElementById("name").value}\\nSĐT: ${document.getElementById("phone").value}\\nĐịa chỉ: ${document.getElementById("address").value}\\nGhi chú: ${document.getElementById("note").value}`;navigator.clipboard?.writeText(msg).catch(()=>{}); alert("Đơn hàng đã được chuẩn bị!\\n\\nNội dung đơn đã được sao chép. Nhấn OK để mở Zalo và gửi cho quán."); window.location.href="https://zalo.me/0946935213"; cart={};updateCount();closeCart()}
renderCats();render();
</script>
</body></html>
